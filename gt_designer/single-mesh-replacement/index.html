<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Single Mesh Procedural Replacement</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #13212b;
        color: #eaf2f7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      #status {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 2;
        min-width: 260px;
        padding: 14px 16px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 12px;
        background: rgb(8 17 23 / 82%);
        box-shadow: 0 12px 36px rgb(0 0 0 / 24%);
      }

      #status h1 {
        margin: 0 0 7px;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #status p {
        margin: 3px 0;
        color: #aabac5;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body[data-state="error"] #status {
        border-color: #d45562;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body data-state="loading">
    <section id="status" aria-live="polite">
      <h1>Procedural Replacement</h1>
      <p id="state">Generating deterministic fixture…</p>
      <p>Reference assets: none</p>
      <p>Network dependencies: none</p>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
