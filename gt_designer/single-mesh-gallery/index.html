<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage 1 Procedural Gallery</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #27303a;
        background: #cfdce7;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      canvas { display: block; }

      .panel {
        position: fixed;
        z-index: 3;
        border: 1px solid rgb(50 60 70 / 16%);
        border-radius: 12px;
        background: rgb(248 246 238 / 92%);
        box-shadow: 0 10px 30px rgb(39 48 58 / 10%);
        backdrop-filter: blur(10px);
      }

      #intro { top: 16px; left: 16px; width: min(430px, calc(100vw - 32px)); padding: 14px 16px; }
      #intro h1 { margin: 0 0 5px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
      #intro p { margin: 0; color: #66717d; font-size: 12px; line-height: 1.5; }
      #status { margin-top: 6px !important; color: #2d6b55 !important; font-weight: 700; }

      #toolbar {
        top: 16px;
        right: 16px;
        display: flex;
        max-width: calc(100vw - 478px);
        padding: 7px;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        appearance: none;
        border: 1px solid rgb(50 60 70 / 13%);
        border-radius: 8px;
        padding: 7px 9px;
        color: #4d5965;
        background: rgb(255 255 255 / 72%);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      button:hover, button.active { border-color: #6082a3; color: #20374d; background: #e4edf5; }
      button.missing { color: #9a6a32; border-style: dashed; }

      .object-label {
        position: fixed;
        z-index: 2;
        pointer-events: none;
        min-width: 140px;
        transform: translate(-50%, calc(-100% - 8px));
        text-align: center;
        color: #303945;
        text-shadow: 0 1px 0 rgb(255 255 255 / 95%), 0 0 5px rgb(255 255 255 / 90%);
      }
      .object-label strong { display: block; font-size: 12px; }
      .object-label span { display: block; margin-top: 2px; color: #2d6b55; font-size: 10px; font-weight: 700; }
      .object-label.missing { color: #845b2d; }
      .object-label.missing span { color: #a36d2e; }

      #error {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 12;
        display: none;
        max-width: min(560px, calc(100vw - 32px));
        padding: 12px 14px;
        border-radius: 10px;
        color: #8e2530;
        background: #fff0f1;
        font: 12px/1.5 ui-monospace, monospace;
        white-space: pre-wrap;
      }

      @media (max-width: 980px) {
        #toolbar { top: auto; right: 12px; bottom: 12px; left: 12px; max-width: none; justify-content: center; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-state="loading">
    <section id="intro" class="panel">
      <h1>Stage 1 Procedural Gallery</h1>
      <p>Same eight slots, camera, one-unit grid, bottom-center pivot, and seven-unit display normalization as the Authored Reference Lab.</p>
      <p id="status">Generating replacements…</p>
    </section>
    <nav id="toolbar" class="panel" aria-label="Camera focus"></nav>
    <div id="labels"></div>
    <div id="error"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
