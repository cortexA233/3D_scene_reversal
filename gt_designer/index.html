<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Procedural Island Prototype</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #9fc8df; }
      canvas { display: block; width: 100%; height: 100%; }
      #loading {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 35%, #25475c, #0b1720 72%);
        transition: opacity 700ms ease, visibility 700ms ease;
      }
      #loading.done { opacity: 0; visibility: hidden; pointer-events: none; }
      .loading-card { width: min(360px, calc(100vw - 48px)); color: #eff8f7; }
      .loading-kicker, .eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 10px; font-weight: 800; opacity: .7; }
      #load-message { margin: 12px 0 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      .track { height: 3px; overflow: hidden; border-radius: 4px; background: rgba(255,255,255,.16); }
      #load-bar { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7cd5bb, #ffe09a); transition: width 240ms ease; }
      #scene-info {
        position: fixed; left: 18px; top: 18px; z-index: 5; width: min(350px, calc(100vw - 36px));
        padding: 15px 16px 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 14px;
        color: #f7fbf7; background: rgba(14,28,31,.58); box-shadow: 0 12px 40px rgba(0,0,0,.14);
        backdrop-filter: blur(13px); text-shadow: 0 1px 3px rgba(0,0,0,.42); pointer-events: none;
      }
      #scene-info h1 { margin: 5px 0 4px; font-family: Georgia, serif; font-size: clamp(21px, 3vw, 30px); font-weight: 500; }
      #variant-description { margin: 0; max-width: 31em; color: rgba(255,255,255,.8); font-size: 12px; line-height: 1.45; }
      #stats { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 10px; font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: rgba(255,255,255,.68); }
      #controls {
        position: fixed; right: 18px; top: 18px; z-index: 5; padding: 10px 12px;
        border: 1px solid rgba(255,255,255,.2); border-radius: 10px; color: rgba(255,255,255,.82);
        background: rgba(14,28,31,.48); backdrop-filter: blur(10px); font: 10px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none; text-align: right;
      }
      #prototype-switcher {
        position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10;
        display: grid; grid-template-columns: 38px minmax(190px, 1fr) 38px; align-items: center;
        min-width: min(360px, calc(100vw - 32px)); padding: 5px; border: 1px solid rgba(255,255,255,.38);
        border-radius: 999px; color: white; background: rgba(9,18,21,.78); box-shadow: 0 12px 45px rgba(0,0,0,.28); backdrop-filter: blur(15px);
      }
      #prototype-switcher button {
        width: 34px; height: 34px; border: 0; border-radius: 50%; color: white; background: rgba(255,255,255,.12);
        cursor: pointer; font-size: 18px; transition: background 160ms ease, transform 160ms ease;
      }
      #prototype-switcher button:hover { background: rgba(255,255,255,.24); transform: scale(1.05); }
      #variant-label { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      #error {
        position: fixed; left: 18px; right: 18px; bottom: 76px; z-index: 30; display: none;
        padding: 12px; border-radius: 8px; color: #ffd5d5; background: rgba(71,10,16,.9);
        white-space: pre-wrap; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (max-width: 700px) {
        #controls { display: none; }
        #scene-info { padding: 12px 13px; }
        #stats { display: none; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-state="loading" data-prototype="full-island">
    <div id="loading">
      <div class="loading-card">
        <div class="loading-kicker">Throwaway visual prototype</div>
        <div id="load-message">Preparing a deterministic island…</div>
        <div class="track"><i id="load-bar"></i></div>
      </div>
    </div>

    <aside id="scene-info">
      <div class="eyebrow">Full-island generator · seed <span id="seed"></span></div>
      <h1 id="variant-name">Procedural Island</h1>
      <p id="variant-description"></p>
      <div id="stats"></div>
    </aside>

    <div id="controls">Drag · orbit<br />Wheel · zoom<br />Right drag · pan<br />Space · auto tour</div>

    <nav id="prototype-switcher" aria-label="Prototype variants">
      <button id="previous-variant" aria-label="Previous island">‹</button>
      <div id="variant-label"></div>
      <button id="next-variant" aria-label="Next island">›</button>
    </nav>

    <pre id="error"></pre>

    <script>
      window.island = { ready: false, error: null };
      const showError = (reason) => {
        const message = reason?.stack || reason?.message || String(reason);
        document.body.dataset.state = "error";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent += message + "\n";
        window.island.error = (window.island.error || "") + message + "\n";
      };
      window.addEventListener("error", (event) => showError(event.error || event.message));
      window.addEventListener("unhandledrejection", (event) => showError(event.reason));
    </script>
    <script type="module" src="./full-island-prototype.js?v=20260729.1"></script>
  </body>
</html>
