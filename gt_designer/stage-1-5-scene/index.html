<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage 1.5 Eight-slot Lab Layout</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #27303a;
        background: #cfdce7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      .panel {
        position: fixed;
        z-index: 3;
        border: 1px solid rgb(50 60 70 / 16%);
        border-radius: 12px;
        background: rgb(248 246 238 / 90%);
        box-shadow: 0 10px 30px rgb(39 48 58 / 10%);
        backdrop-filter: blur(10px);
      }

      #intro {
        top: 16px;
        left: 16px;
        width: min(420px, calc(100vw - 32px));
        padding: 14px 16px;
      }

      #intro h1 {
        margin: 0 0 5px;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #intro p {
        margin: 0;
        color: #66717d;
        font-size: 12px;
        line-height: 1.5;
      }

      #intro .boundary {
        margin-top: 6px;
        color: #7b6e5d;
        font-size: 11px;
      }

      #toolbar {
        top: 16px;
        right: 16px;
        display: flex;
        max-width: calc(100vw - 468px);
        padding: 7px;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        appearance: none;
        border: 1px solid rgb(50 60 70 / 13%);
        border-radius: 8px;
        padding: 7px 9px;
        color: #4d5965;
        background: rgb(255 255 255 / 72%);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      button:hover,
      button.active {
        border-color: #6082a3;
        color: #20374d;
        background: #e4edf5;
      }

      .object-label {
        position: fixed;
        z-index: 2;
        min-width: 120px;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 8px));
        color: #303945;
        text-align: center;
        text-shadow:
          0 1px 0 rgb(255 255 255 / 95%),
          0 0 5px rgb(255 255 255 / 90%);
      }

      .object-label strong,
      .object-label span {
        display: block;
      }

      .object-label strong {
        font-size: 12px;
      }

      .object-label span {
        margin-top: 2px;
        color: #6a7580;
        font-size: 10px;
      }

      #error {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 12;
        display: none;
        max-width: min(560px, calc(100vw - 32px));
        padding: 12px 14px;
        border-radius: 10px;
        color: #8e2530;
        background: #fff0f1;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body[data-state="error"] #intro {
        border-color: #c66b73;
      }

      @media (max-width: 920px) {
        #toolbar {
          top: auto;
          right: 12px;
          bottom: 12px;
          left: 12px;
          max-width: none;
          justify-content: center;
        }

        .object-label span {
          display: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-state="loading" data-object-count="0">
    <section id="intro" class="panel" aria-live="polite">
      <h1>Stage 1.5 · Eight-slot Lab Layout</h1>
      <p id="state">Assembling procedural replacements…</p>
      <p class="boundary">
        Matches the eight-object Single Mesh Lab arrangement. Four current
        replacement slots are populated; unfinished slots remain empty.
      </p>
    </section>
    <nav id="toolbar" class="panel" aria-label="Camera focus"></nav>
    <div id="labels"></div>
    <div id="error"></div>
    <script type="module" src="./main.js?v=20260729.eight-slot-1"></script>
  </body>
</html>
