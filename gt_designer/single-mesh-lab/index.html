<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Single Mesh Reconstruction Lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #27303a;
        background: #cfdce7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      .panel {
        position: fixed;
        z-index: 3;
        border: 1px solid rgba(50, 60, 70, 0.16);
        border-radius: 12px;
        background: rgba(248, 246, 238, 0.9);
        box-shadow: 0 10px 30px rgba(39, 48, 58, 0.1);
        backdrop-filter: blur(10px);
      }

      #intro {
        top: 16px;
        left: 16px;
        width: min(390px, calc(100vw - 32px));
        padding: 14px 16px;
      }

      #intro h1 {
        margin: 0 0 5px;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #intro p {
        margin: 0;
        color: #66717d;
        font-size: 12px;
        line-height: 1.5;
      }

      #toolbar {
        top: 16px;
        right: 16px;
        display: flex;
        max-width: calc(100vw - 438px);
        padding: 7px;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        appearance: none;
        border: 1px solid rgba(50, 60, 70, 0.13);
        border-radius: 8px;
        padding: 7px 9px;
        color: #4d5965;
        background: rgba(255, 255, 255, 0.72);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      button:hover,
      button.active {
        border-color: #6082a3;
        color: #20374d;
        background: #e4edf5;
      }

      .object-label {
        position: fixed;
        z-index: 2;
        pointer-events: none;
        min-width: 120px;
        transform: translate(-50%, calc(-100% - 8px));
        text-align: center;
        color: #303945;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.95),
          0 0 5px rgba(255, 255, 255, 0.9);
      }

      .object-label strong {
        display: block;
        font-size: 12px;
      }

      .object-label span {
        display: none;
        margin-top: 2px;
        color: #6a7580;
        font-size: 10px;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        color: #eaf1f7;
        background: #253442;
        transition: opacity 300ms ease;
      }

      #loading.done {
        pointer-events: none;
        opacity: 0;
      }

      #loading .status {
        width: min(360px, calc(100vw - 48px));
        text-align: center;
      }

      #loading p {
        margin: 0 0 10px;
        font-size: 12px;
      }

      #loading .track {
        height: 4px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
      }

      #loading .bar {
        width: 0;
        height: 100%;
        background: #86c4ef;
        transition: width 120ms linear;
      }

      #error {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 12;
        display: none;
        max-width: min(560px, calc(100vw - 32px));
        padding: 12px 14px;
        border-radius: 10px;
        color: #8e2530;
        background: #fff0f1;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }

      @media (max-width: 920px) {
        #toolbar {
          top: auto;
          right: 12px;
          bottom: 12px;
          left: 12px;
          max-width: none;
          justify-content: center;
        }

        .object-label span {
          display: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <section id="intro" class="panel">
      <h1>Single Mesh Reconstruction Lab</h1>
      <p>
        Eight static references · one mesh and one material each · bottom-center
        pivots · largest dimension normalized to 7 units. Drag to orbit and scroll
        to zoom.
      </p>
    </section>
    <nav id="toolbar" class="panel" aria-label="Camera focus"></nav>
    <div id="labels"></div>
    <div id="loading">
      <div class="status">
        <p id="loading-text">Loading the authored reference meshes…</p>
        <div class="track"><div id="loading-bar" class="bar"></div></div>
      </div>
    </div>
    <div id="error"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
