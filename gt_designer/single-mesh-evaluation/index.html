<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Single Mesh Evaluation Harness</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #e9eff3;
        background: #101820;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 860px;
        min-height: 680px;
        margin: 0;
        background:
          radial-gradient(circle at 75% 35%, #223342 0, #101820 52%),
          #101820;
      }

      main {
        display: grid;
        grid-template-columns: 320px minmax(512px, 1fr);
        align-items: center;
        min-height: 100vh;
        gap: 24px;
        padding: 24px;
      }

      .panel {
        padding: 20px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 16px;
        background: rgb(7 14 20 / 84%);
        box-shadow: 0 18px 48px rgb(0 0 0 / 26%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 17px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      #state {
        min-height: 42px;
        margin: 0 0 16px;
        color: #9fb3c1;
        font-size: 12px;
        line-height: 1.5;
      }

      label {
        display: grid;
        margin: 12px 0;
        gap: 5px;
        color: #93a8b7;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      select,
      button {
        width: 100%;
        min-height: 38px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 8px;
        color: #e9eff3;
        background: #1b2a35;
        font: inherit;
      }

      button {
        margin-top: 9px;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }

      #summary {
        min-height: 92px;
        margin: 18px 0 0;
        color: #9fb3c1;
        font: 11px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }

      .preview-shell {
        display: grid;
        place-items: center;
      }

      #preview {
        width: min(72vw, calc(100vh - 48px));
        height: min(72vw, calc(100vh - 48px));
        max-width: 768px;
        max-height: 768px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 14px;
        background: #000;
        box-shadow: 0 24px 70px rgb(0 0 0 / 36%);
      }

      body[data-state="error"] .panel {
        border-color: #d45562;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-state="loading" data-capture-count="0">
    <main>
      <section class="panel">
        <h1>Evaluation Harness</h1>
        <p id="state">Loading Authored Reference…</p>
        <label>
          Comparison mode
          <select id="mode"></select>
        </label>
        <label>
          Evaluation pass
          <select id="pass"></select>
        </label>
        <label>
          Fixed view
          <select id="view"></select>
        </label>
        <button id="capture-all" type="button">Capture complete protocol</button>
        <button id="download-manifest" type="button" disabled>
          Download manifest
        </button>
        <pre id="summary"></pre>
      </section>
      <section class="preview-shell" aria-label="Comparison preview">
        <canvas id="preview" width="512" height="512"></canvas>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
